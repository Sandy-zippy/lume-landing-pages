<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background: #C41E3A;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 100px;
}
.brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  letter-spacing: 10px;
  color: #fff;
  text-transform: uppercase;
  margin-bottom: 60px;
}
.quote {
  font-family: 'Cormorant Garamond', serif;
  font-size: 52px;
  line-height: 1.35;
  text-align: center;
  margin-bottom: 16px;
}
.quote-white { color: #fff; }
.quote-gold { color: #C9A962; }
.attribution {
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 48px;
}
.gold-divider {
  width: 60px;
  height: 2px;
  background: #C9A962;
  margin-bottom: 48px;
}
.body-text {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  line-height: 1.7;
  color: rgba(255,255,255,0.8);
  text-align: center;
  margin-bottom: 52px;
}
.cta {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 3px;
  color: #fff;
  text-transform: uppercase;
}
</style>
</head>
<body>
  <div class="brand">LUME</div>
  <div class="quote">
    <span class="quote-white">Wealth isn't measured in what you own.</span><br>
    <span class="quote-gold">It's measured in what you've experienced.</span>
  </div>
  <div class="attribution">&mdash; The LUME Philosophy</div>
  <div class="gold-divider"></div>
  <div class="body-text">
    Two curated experiences per month.<br>
    40 selected guests per evening.<br>
    Membership by application.
  </div>
  <div class="cta">TAKE THE ASSESSMENT &rarr;</div>
</body>
</html>
