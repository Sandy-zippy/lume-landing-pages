<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background: #f8f6f3;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 70px 100px;
}
.logo {
  max-height: 50px;
  margin-bottom: 60px;
}
.word-stack {
  text-align: center;
  margin-bottom: 50px;
}
.word-stack .big-red {
  font-family: 'Cormorant Garamond', serif;
  font-size: 80px;
  font-weight: 700;
  color: #C41E3A;
  line-height: 1.15;
}
.word-stack .small-grey {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px;
  font-weight: 400;
  color: #bbb;
  line-height: 1.3;
}
.word-stack .big-charcoal {
  font-family: 'Cormorant Garamond', serif;
  font-size: 80px;
  font-weight: 700;
  color: #2a2a2a;
  line-height: 1.15;
}
.gold-divider {
  width: 60px;
  height: 2px;
  background: #C9A962;
  margin-bottom: 44px;
}
.body-text {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  line-height: 1.75;
  color: #3a3a3a;
  text-align: center;
  max-width: 820px;
  margin-bottom: 40px;
}
.footer-line {
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  letter-spacing: 3px;
  color: #999;
  text-transform: uppercase;
  margin-bottom: auto;
}
.cta {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 3px;
  color: #C41E3A;
  text-transform: uppercase;
}
</style>
</head>
<body>
  <img src="../../assets/lume-logo-transparent.png" alt="LUME" class="logo">
  <div class="word-stack">
    <div class="big-red">Designed.</div>
    <div class="small-grey">Not</div>
    <div class="big-charcoal">defaulted to.</div>
  </div>
  <div class="gold-divider"></div>
  <div class="body-text">
    The venue is chosen for atmosphere, not availability. The guest list is curated for chemistry, not capacity. The experience is shaped around a theme that rewards attention and depth.
  </div>
  <div class="footer-line">LUME &middot; Hyderabad &middot; Two evenings per month</div>
  <div class="cta">TAKE THE ASSESSMENT &rarr;</div>
</body>
</html>
