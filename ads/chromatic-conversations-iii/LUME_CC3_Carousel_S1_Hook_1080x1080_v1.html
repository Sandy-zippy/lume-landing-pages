<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME CC3 Carousel — Slide 1: Hook</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #1a1a1a;
  }

  /* Red swirl background */
  .bg-swirl {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 15%, #000000 0%, transparent 50%),
      radial-gradient(ellipse 70% 90% at 85% 80%, #111111 0%, transparent 45%),
      radial-gradient(ellipse 50% 40% at 50% 50%, #0a0a0a 0%, transparent 60%),
      radial-gradient(circle at 10% 90%, #000000 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #9B1B30 0%, transparent 35%),
      conic-gradient(from 45deg at 30% 70%, #111111, #000000, #0a0a0a, #111111, #111111),
      conic-gradient(from 200deg at 70% 30%, #000000, #0a0a0a, #111111, #000000),
      radial-gradient(ellipse 120% 80% at 50% 50%, #0a0a0a, #4A0510);
    filter: blur(30px) saturate(1.3);
  }

  .bg-swirl::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 40% 35% at 25% 25%, rgba(0,0,0,0.6) 0%, transparent 70%),
      radial-gradient(ellipse 35% 50% at 75% 75%, rgba(0,0,0,0.5) 0%, transparent 60%),
      radial-gradient(ellipse 60% 30% at 60% 20%, rgba(0,0,0,0.4) 0%, transparent 50%);
    filter: blur(15px);
  }

  .texture {
    position: absolute;
    inset: 0;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    mix-blend-mode: overlay;
  }

  /* White panel — catalog-style */
  .panel {
    position: absolute;
    top: 100px;
    left: 130px;
    right: 130px;
    bottom: 100px;
    background: rgba(248, 246, 243, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 50px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .logo {
    position: absolute;
    top: 45px;
    left: 50%;
    transform: translateX(-50%);
  }

  .logo img {
    height: 60px;
    width: auto;
  }

  .panel-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 0;
  }

  .overline {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 30px;
  }

  .divider-top {
    width: 50px;
    height: 1px;
    background: #C9A962;
    margin-bottom: 40px;
  }

  .headline {
    font-family: 'Cormorant', serif;
    font-size: 46px;
    font-weight: 600;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.25;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .headline em {
    font-style: italic;
    color: #000000;
    font-weight: 400;
  }

  .divider-bottom {
    width: 50px;
    height: 1px;
    background: #C9A962;
    margin-top: 40px;
    margin-bottom: 30px;
  }

  .sub {
    font-family: 'Cormorant', serif;
    font-size: 20px;
    font-weight: 400;
    font-style: italic;
    color: #777;
    text-align: center;
    line-height: 1.5;
  }

  /* Swipe indicator */
  .swipe {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 10;
  }

  .swipe-arrow {
    width: 28px;
    height: 28px;
    border-right: 2px solid rgba(255,255,255,0.6);
    border-bottom: 2px solid rgba(255,255,255,0.6);
    transform: rotate(-45deg);
  }

  .swipe-text {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    writing-mode: vertical-rl;
    margin-top: 6px;
  }

  /* Slide counter */
  .slide-counter {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
  }

  .dot.active {
    background: #C9A962;
    box-shadow: 0 0 6px rgba(201,169,98,0.5);
  }
</style>
</head>
<body>
  <div class="bg-swirl"></div>
  <div class="texture"></div>

  <div class="panel">
    <div class="logo">
      <img src="../../assets/lume-logo-transparent.png" alt="LUME">
    </div>

    <div class="panel-content">
      <div class="overline">Chromatic Conversations III</div>
      <div class="divider-top"></div>
      <div class="headline">Beyond Aesthetics.<br><em>Beyond Impulse.</em></div>
      <div class="divider-bottom"></div>
      <div class="sub">A private evening on<br>Art as Investment</div>
    </div>
  </div>

  <div class="swipe">
    <div class="swipe-arrow"></div>
    <div class="swipe-text">Swipe</div>
  </div>

  <div class="slide-counter">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
