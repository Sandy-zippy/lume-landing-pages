<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Chromatic Conversations III — Listicle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #f8f6f3;
  }

  /* Red accent strip at top */
  .red-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 10px;
    background: linear-gradient(90deg, #FF5149, #C41E3A, #FF5149);
  }

  /* Subtle texture overlay */
  .texture {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(0,0,0,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 10% 90%, rgba(0,0,0,0.03) 0%, transparent 50%);
    pointer-events: none;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 70px 90px 50px;
    z-index: 10;
  }

  .header {
    text-align: center;
    margin-bottom: 50px;
  }
  .header-label {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #C41E3A;
    margin-bottom: 16px;
  }
  .header-title {
    font-family: 'Cormorant', serif;
    font-weight: 700;
    font-size: 62px;
    color: #1a1a1a;
    line-height: 1.1;
    letter-spacing: -1px;
  }
  .header-divider {
    width: 80px; height: 3px;
    background: linear-gradient(90deg, #C9A962, #e8d5a0);
    margin: 24px auto 0;
  }

  .list-items {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 32px;
    padding: 10px 0;
  }

  .list-item {
    display: flex;
    align-items: flex-start;
    gap: 36px;
    padding: 36px 40px;
    background: rgba(255,255,255,0.8);
    border-radius: 4px;
    border-left: 4px solid rgba(201,169,98,0.4);
    box-shadow: 0 2px 20px rgba(0,0,0,0.04);
  }
  .list-number {
    font-family: 'Cormorant', serif;
    font-weight: 700;
    font-size: 90px;
    line-height: 0.85;
    color: #C9A962;
    min-width: 80px;
    text-align: center;
    opacity: 0.9;
  }
  .list-text {
    font-family: 'Cormorant', serif;
    font-weight: 500;
    font-size: 36px;
    line-height: 1.3;
    color: #1a1a1a;
    padding-top: 8px;
  }

  .cta-section {
    text-align: center;
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgba(201,169,98,0.25);
  }
  .cta-invite {
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 30px;
    color: #555;
    margin-bottom: 20px;
  }
  .cta-details {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    margin-bottom: 20px;
  }
  .cta-details span {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 22px;
    color: #1a1a1a;
  }
  .cta-details .dot {
    width: 5px; height: 5px;
    background: #C9A962;
    border-radius: 50%;
  }
  .cta-details .price {
    font-weight: 700;
    color: #C41E3A;
    font-size: 24px;
  }
  .logo-bottom {
    width: 130px;
    margin: 15px auto 0;
    display: block;
  }
</style>
</head>
<body>
  <div class="red-accent"></div>
  <div class="texture"></div>
  <div class="content">
    <div class="header">
      <div class="header-label">Chromatic Conversations III</div>
      <div class="header-title">Why Art as<br>Investment?</div>
      <div class="header-divider"></div>
    </div>

    <div class="list-items">
      <div class="list-item">
        <div class="list-number">1</div>
        <div class="list-text">Outperformed the S&amp;P 500<br>in the last 5 years</div>
      </div>
      <div class="list-item">
        <div class="list-number">2</div>
        <div class="list-text">Hedge against inflation<br>with tangible beauty</div>
      </div>
      <div class="list-item">
        <div class="list-number">3</div>
        <div class="list-text">Build a collection that<br>grows in value</div>
      </div>
    </div>

    <div class="cta-section">
      <div class="cta-invite">Join 40 curated guests to explore this opportunity.</div>
      <div class="cta-details">
        <span>Feb 28, 2026</span>
        <div class="dot"></div>
        <span>6:30 PM</span>
        <div class="dot"></div>
        <span>Elements by Nirvania</span>
        <div class="dot"></div>
        <span class="price">&#8377;4,000</span>
      </div>
      <img src="../../assets/lume-logo-transparent.png" alt="LUME" class="logo-bottom">
    </div>
  </div>
</body>
</html>
