<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Chromatic Conversations III — Hero Portrait</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #1a0008;
  }
  .bg-canvas {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at 20% 30%, #000000 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 80% 70%, #111111 0%, transparent 55%),
      radial-gradient(ellipse 60% 80% at 50% 50%, #0a0a0a 0%, transparent 50%),
      radial-gradient(ellipse 40% 50% at 70% 20%, #000000 0%, transparent 45%),
      radial-gradient(ellipse 50% 40% at 30% 80%, #a01030 0%, transparent 50%),
      conic-gradient(from 45deg at 35% 40%, #000000, #0a0a0a, #111111, #0a0a0a, #000000),
      #1a0008;
  }
  .bg-swirl-1 {
    position: absolute;
    width: 900px; height: 900px;
    top: -100px; left: -200px;
    background: conic-gradient(from 120deg at 50% 50%, transparent 0%, #00000022 15%, transparent 30%, #11111133 45%, transparent 60%);
    border-radius: 50%;
    filter: blur(40px);
    transform: rotate(-15deg);
  }
  .bg-swirl-2 {
    position: absolute;
    width: 700px; height: 700px;
    bottom: -50px; right: -150px;
    background: conic-gradient(from 240deg at 50% 50%, transparent 0%, #00000033 20%, transparent 40%, #0a0a0a44 60%, transparent 80%);
    border-radius: 50%;
    filter: blur(50px);
    transform: rotate(30deg);
  }
  .bg-texture {
    position: absolute;
    inset: 0;
    background:
      repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(200,160,100,0.02) 2deg, transparent 4deg) 0 0 / 300px 300px;
    mix-blend-mode: overlay;
  }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px;
    z-index: 10;
  }
  .logo {
    width: 180px;
    margin-bottom: 40px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }
  .edition-tag {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #C9A962;
    margin-bottom: 20px;
  }
  .white-panel {
    background: rgba(248,246,243,0.97);
    border-radius: 4px;
    padding: 70px 65px 60px;
    width: 860px;
    text-align: center;
    box-shadow: 0 20px 80px rgba(0,0,0,0.4);
    position: relative;
  }
  .white-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 3px;
    background: linear-gradient(90deg, #C9A962, #e8d5a0, #C9A962);
  }
  .panel-label {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #000000;
    margin-bottom: 12px;
  }
  .panel-title {
    font-family: 'Cormorant', serif;
    font-weight: 600;
    font-size: 72px;
    line-height: 1.05;
    color: #1a1a1a;
    margin-bottom: 10px;
  }
  .panel-subtitle {
    font-family: 'Cormorant', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 38px;
    color: #1a1a1a;
    margin-bottom: 30px;
  }
  .gold-divider {
    width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, #C9A962, transparent);
    margin: 0 auto 28px;
  }
  .panel-detail {
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 26px;
    color: #444;
    line-height: 1.7;
    margin-bottom: 6px;
  }
  .panel-detail strong {
    font-weight: 600;
    color: #1a1a1a;
  }
  .panel-price {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 30px;
    color: #000000;
    margin-top: 24px;
    margin-bottom: 24px;
  }
  .panel-tagline {
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 28px;
    color: #666;
    margin-top: 10px;
  }
  .partners-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 45px;
    padding-top: 30px;
    border-top: 1px solid rgba(201,169,98,0.3);
  }
  .partner-item {
    text-align: center;
  }
  .partner-label {
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 4px;
  }
  .partner-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: #1a1a1a;
  }
</style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="bg-swirl-1"></div>
  <div class="bg-swirl-2"></div>
  <div class="bg-texture"></div>
  <div class="content">
    <img src="../../assets/lume-logo-white.png" alt="LUME" class="logo">
    <div class="edition-tag">Edition III</div>
    <div class="white-panel">
      <div class="panel-label">A Private Evening</div>
      <div class="panel-title">Chromatic<br>Conversations</div>
      <div class="panel-subtitle">Art as Investment</div>
      <div class="gold-divider"></div>
      <div class="panel-detail"><strong>Saturday, February 28, 2026</strong></div>
      <div class="panel-detail">6:30 PM onwards</div>
      <div class="panel-detail">Elements by Nirvania, Hyderabad</div>
      <div class="panel-price">&#8377;4,000 per guest &middot; 40 Seats Only</div>
      <div class="panel-tagline">Beyond Aesthetics. Beyond Impulse.</div>
      <div class="partners-row">
        <div class="partner-item">
          <div class="partner-label">Media</div>
          <div class="partner-name">Hashtag India</div>
        </div>
        <div class="partner-item">
          <div class="partner-label">Event</div>
          <div class="partner-name">We Connect</div>
        </div>
        <div class="partner-item">
          <div class="partner-label">Venue</div>
          <div class="partner-name">Elements by Nirvania</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
