<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Chromatic Conversations III — Story Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #1a0008;
  }

  /* Red swirl background */
  .bg-canvas {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 100% 60% at 50% 40%, #C41E3A 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 20% 60%, #B80000 0%, transparent 50%),
      radial-gradient(ellipse 80% 40% at 80% 30%, #8B0000 0%, transparent 45%),
      radial-gradient(ellipse 60% 70% at 40% 80%, #a01030 0%, transparent 50%),
      conic-gradient(from 90deg at 50% 50%, #C41E3A, #8B0000, #6B0020, #B80000, #C41E3A),
      #1a0008;
  }
  .bg-swirl {
    position: absolute;
    width: 1200px; height: 1200px;
    top: 200px; left: -100px;
    background: conic-gradient(from 200deg at 50% 50%, transparent 0%, #C41E3A22 12%, transparent 25%, #B8000033 40%, transparent 55%, rgba(201,169,98,0.04) 70%, transparent 85%);
    border-radius: 50%;
    filter: blur(60px);
    transform: rotate(20deg);
  }
  .bg-swirl-2 {
    position: absolute;
    width: 800px; height: 800px;
    top: 800px; right: -200px;
    background: conic-gradient(from 60deg at 50% 50%, transparent 0%, rgba(139,0,0,0.2) 15%, transparent 30%);
    border-radius: 50%;
    filter: blur(50px);
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  /* Logo safe zone — 150px from top */
  .logo-area {
    padding-top: 150px;
    margin-bottom: 80px;
  }
  .logo {
    width: 200px;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
  }

  .edition-tag {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #C9A962;
    margin-bottom: 50px;
  }

  .main-title {
    font-family: 'Cormorant', serif;
    font-weight: 700;
    font-size: 80px;
    line-height: 1.05;
    color: #fff;
    text-align: center;
    text-shadow: 0 4px 40px rgba(0,0,0,0.4);
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .main-subtitle {
    font-family: 'Cormorant', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 48px;
    color: rgba(255,255,255,0.9);
    text-align: center;
    margin-bottom: 80px;
  }

  .gold-line {
    width: 100px; height: 2px;
    background: linear-gradient(90deg, transparent, #C9A962, transparent);
    margin-bottom: 70px;
  }

  .details-block {
    text-align: center;
    margin-bottom: 40px;
  }
  .detail-line {
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 30px;
    color: rgba(255,255,255,0.85);
    line-height: 1.8;
    letter-spacing: 1px;
  }
  .detail-line strong {
    font-weight: 600;
    color: #fff;
  }
  .detail-line.highlight {
    color: #C9A962;
    font-weight: 600;
    font-size: 32px;
    margin-top: 10px;
  }

  .tagline {
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 34px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    margin-top: 60px;
    margin-bottom: 60px;
  }

  /* Swipe up CTA — above 270px from bottom */
  .swipe-cta {
    position: absolute;
    bottom: 310px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  .swipe-arrow {
    font-size: 36px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 10px;
  }
  .swipe-text {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
</style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="bg-swirl"></div>
  <div class="bg-swirl-2"></div>

  <div class="content">
    <div class="logo-area">
      <img src="../../assets/lume-logo-white.png" alt="LUME" class="logo">
    </div>
    <div class="edition-tag">Edition III</div>
    <div class="main-title">CHROMATIC<br>CONVERSATIONS</div>
    <div class="main-subtitle">Art as Investment</div>
    <div class="gold-line"></div>
    <div class="details-block">
      <div class="detail-line"><strong>Saturday, February 28, 2026</strong></div>
      <div class="detail-line">6:30 PM &middot; Elements by Nirvania</div>
      <div class="detail-line highlight">&#8377;4,000 &nbsp;|&nbsp; Limited Seats</div>
    </div>
    <div class="tagline">Beyond Aesthetics. Beyond Impulse.</div>
    <div class="swipe-cta">
      <div class="swipe-arrow">&uarr;</div>
      <div class="swipe-text">Swipe Up to Reserve</div>
    </div>
  </div>
</body>
</html>
