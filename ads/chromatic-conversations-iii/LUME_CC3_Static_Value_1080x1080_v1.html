<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Value/Educational Angle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #f8f6f3;
  }

  /* Red accent lines top and bottom */
  .accent-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #FF5149, #C41E3A, #FF5149);
  }

  .accent-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #FF5149, #C41E3A, #FF5149);
  }

  .texture {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 110px;
  }

  .logo-container {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
  }

  .logo-container img {
    height: 60px;
    width: auto;
  }

  .headline {
    font-family: 'Cormorant', serif;
    font-size: 44px;
    font-weight: 600;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 45px;
    max-width: 750px;
  }

  .gold-divider {
    width: 60px;
    height: 1px;
    background: #C9A962;
    margin-bottom: 45px;
  }

  /* Numbered points */
  .points {
    display: flex;
    flex-direction: column;
    gap: 30px;
    margin-bottom: 50px;
    width: 100%;
    max-width: 700px;
  }

  .point {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  .point-number {
    font-family: 'Cormorant', serif;
    font-size: 52px;
    font-weight: 700;
    color: #C9A962;
    line-height: 1;
    min-width: 50px;
    text-align: right;
  }

  .point-text {
    font-family: 'Cormorant', serif;
    font-size: 26px;
    font-weight: 400;
    color: #333;
    line-height: 1.35;
    padding-top: 8px;
    border-left: 1px solid rgba(201,169,98,0.3);
    padding-left: 24px;
  }

  .bottom-cta {
    font-family: 'Cormorant', serif;
    font-size: 22px;
    font-weight: 500;
    font-style: italic;
    color: #C41E3A;
    text-align: center;
    margin-bottom: 20px;
  }

  .details-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .details-row .item {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #999;
  }

  .details-row .sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #C9A962;
  }
</style>
</head>
<body>
  <div class="accent-top"></div>
  <div class="accent-bottom"></div>
  <div class="texture"></div>

  <div class="content">
    <div class="logo-container">
      <img src="../../assets/lume-logo-transparent.png" alt="LUME">
    </div>

    <div class="headline">3 Reasons Art Is the Smartest Alternative Investment</div>

    <div class="gold-divider"></div>

    <div class="points">
      <div class="point">
        <div class="point-number">1</div>
        <div class="point-text">Returns averaging 14% annually over the last decade</div>
      </div>
      <div class="point">
        <div class="point-number">2</div>
        <div class="point-text">Zero correlation with stock market volatility</div>
      </div>
      <div class="point">
        <div class="point-number">3</div>
        <div class="point-text">A tangible asset you can actually enjoy</div>
      </div>
    </div>

    <div class="bottom-cta">Learn more at Chromatic Conversations III</div>

    <div class="details-row">
      <div class="item">Feb 28</div>
      <div class="sep"></div>
      <div class="item">6:30 PM</div>
      <div class="sep"></div>
      <div class="item">Elements by Nirvania</div>
      <div class="sep"></div>
      <div class="item">₹4,000</div>
    </div>
  </div>
</body>
</html>
