<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Chromatic Conversations III — Story Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #0a0a0a;
  }

  /* Dark bg with red accent elements */
  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0,0,0,0.2) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 20% 70%, rgba(0,0,0,0.1) 0%, transparent 55%),
      radial-gradient(ellipse 30% 50% at 80% 30%, rgba(0,0,0,0.08) 0%, transparent 50%);
  }
  .red-accent-left {
    position: absolute;
    left: 0; top: 400px;
    width: 6px; height: 400px;
    background: linear-gradient(to bottom, transparent, #000000, transparent);
    box-shadow: 0 0 30px 5px rgba(0,0,0,0.2);
  }
  .red-accent-right {
    position: absolute;
    right: 0; top: 800px;
    width: 6px; height: 300px;
    background: linear-gradient(to bottom, transparent, #111111, transparent);
    box-shadow: 0 0 30px 5px rgba(0,0,0,0.2);
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    /* Center content in safe 720px width */
    padding: 0 180px;
  }

  .logo-area {
    padding-top: 150px;
    margin-bottom: 120px;
  }
  .logo {
    width: 180px;
    opacity: 0.85;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));
  }

  .countdown-main {
    text-align: center;
    margin-bottom: 60px;
  }
  .countdown-label {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 24px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 20px;
  }
  .countdown-big {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 100px;
    color: #000000;
    text-shadow: 0 0 80px rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.3);
    line-height: 1;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .gold-divider {
    width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, #C9A962, transparent);
    margin: 50px auto;
  }

  .event-title {
    font-family: 'Cormorant', serif;
    font-weight: 600;
    font-size: 56px;
    color: #fff;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .event-subtitle {
    font-family: 'Cormorant', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 38px;
    color: rgba(255,255,255,0.8);
    text-align: center;
    margin-bottom: 50px;
  }

  .detail-strip {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 50px;
  }
  .detail-strip span {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 1px;
  }
  .detail-strip .sep {
    width: 5px; height: 5px;
    background: #C9A962;
    border-radius: 50%;
  }

  .exclusive-text {
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 32px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    max-width: 600px;
    line-height: 1.4;
    /* Position above bottom safe zone */
    position: absolute;
    bottom: 340px;
    left: 50%;
    transform: translateX(-50%);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="red-accent-left"></div>
  <div class="red-accent-right"></div>

  <div class="content">
    <div class="logo-area">
      <img src="../../assets/lume-logo-white.png" alt="LUME" class="logo">
    </div>

    <div class="countdown-main">
      <div class="countdown-label">Don&rsquo;t miss it</div>
      <div class="countdown-big">THIS<br>SATURDAY</div>
    </div>

    <div class="gold-divider"></div>

    <div class="event-title">Chromatic<br>Conversations III</div>
    <div class="event-subtitle">A curated evening on Art as Investment</div>

    <div class="detail-strip">
      <span>Elements by Nirvania</span>
      <div class="sep"></div>
      <span>6:30 PM</span>
    </div>
  </div>

  <div class="exclusive-text">Don&rsquo;t miss Hyderabad&rsquo;s most<br>exclusive art evening.</div>
</body>
</html>
