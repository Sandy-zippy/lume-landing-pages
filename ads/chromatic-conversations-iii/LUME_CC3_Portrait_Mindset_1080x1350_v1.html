<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Chromatic Conversations III — Mindset Shift</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
  }

  /* TOP HALF — subdued, grey */
  .top-half {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 580px;
    background: #e8e6e3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    text-align: center;
  }
  .top-half::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(to bottom, #e8e6e3, #d8d5d0);
  }
  .top-quote {
    font-family: 'Cormorant', serif;
    font-weight: 400;
    font-size: 54px;
    line-height: 1.25;
    color: #888;
    position: relative;
    z-index: 2;
  }
  .top-quote em {
    font-style: italic;
    color: #999;
  }
  .top-icon {
    font-size: 80px;
    color: #bbb;
    margin-bottom: 20px;
    font-family: 'Cormorant', serif;
    opacity: 0.5;
  }

  /* GOLD DIVIDER */
  .divider-zone {
    position: absolute;
    top: 555px; left: 0; right: 0;
    height: 50px;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gold-line {
    width: 700px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #C9A962, #e8d5a0, #C9A962, transparent);
    position: relative;
  }
  .gold-line::before {
    content: '';
    position: absolute;
    top: -4px; left: 50%; transform: translateX(-50%);
    width: 11px; height: 11px;
    background: #C9A962;
    border-radius: 50%;
  }

  /* BOTTOM HALF — vibrant */
  .bottom-half {
    position: absolute;
    top: 580px; left: 0; right: 0;
    bottom: 0;
    background:
      radial-gradient(ellipse 80% 100% at 30% 30%, #000000 0%, transparent 60%),
      radial-gradient(ellipse 70% 80% at 70% 70%, #111111 0%, transparent 55%),
      radial-gradient(ellipse 50% 60% at 50% 50%, #0a0a0a 0%, transparent 50%),
      conic-gradient(from 180deg at 40% 60%, #000000, #0a0a0a, #111111, #0a0a0a, #000000),
      #1a0008;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 80px 40px;
    text-align: center;
  }
  .bottom-half::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      conic-gradient(from 60deg at 60% 40%, transparent 0%, rgba(201,169,98,0.06) 10%, transparent 20%);
    pointer-events: none;
  }
  .bottom-quote {
    font-family: 'Cormorant', serif;
    font-weight: 600;
    font-size: 54px;
    line-height: 1.25;
    color: #fff;
    margin-bottom: 8px;
    position: relative;
    z-index: 2;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .bottom-quote .gold {
    color: #C9A962;
  }
  .cc-line {
    font-family: 'Cormorant', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 32px;
    color: rgba(255,255,255,0.85);
    margin-top: 24px;
    margin-bottom: 32px;
    position: relative;
    z-index: 2;
  }
  .event-strip {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(201,169,98,0.3);
    border-radius: 4px;
    padding: 22px 50px;
    display: flex;
    gap: 35px;
    align-items: center;
    position: relative;
    z-index: 2;
  }
  .event-strip .sep {
    width: 1px; height: 36px;
    background: rgba(201,169,98,0.4);
  }
  .event-strip span {
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 1px;
  }
  .event-strip .price {
    font-weight: 600;
    color: #C9A962;
  }
  .logo-bottom {
    position: absolute;
    bottom: 35px; right: 50px;
    width: 120px;
    opacity: 0.85;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="top-half">
    <div class="top-icon">&ldquo;</div>
    <div class="top-quote">Most people see art<br>as <em>decoration.</em></div>
  </div>

  <div class="divider-zone">
    <div class="gold-line"></div>
  </div>

  <div class="bottom-half">
    <div class="bottom-quote">Smart investors see it<br>as an <span class="gold">asset class.</span></div>
    <div class="cc-line">Chromatic Conversations III &mdash; learn the difference.</div>
    <div class="event-strip">
      <span>Feb 28, 2026</span>
      <div class="sep"></div>
      <span>6:30 PM</span>
      <div class="sep"></div>
      <span>Elements by Nirvania</span>
      <div class="sep"></div>
      <span class="price">&#8377;4,000</span>
    </div>
  </div>

  <img src="../../assets/lume-logo-white.png" alt="LUME" class="logo-bottom">
</body>
</html>
