<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Chromatic Conversations III — Official Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #1a1a1a;
  }

  /* Red swirl background using layered gradients */
  .bg-swirl {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 15%, #C41E3A 0%, transparent 50%),
      radial-gradient(ellipse 70% 90% at 85% 80%, #B80000 0%, transparent 45%),
      radial-gradient(ellipse 50% 40% at 50% 50%, #8B0000 0%, transparent 60%),
      radial-gradient(circle at 10% 90%, #C41E3A 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #9B1B30 0%, transparent 35%),
      conic-gradient(from 45deg at 30% 70%, #B80000, #C41E3A, #8B0000, #A01525, #B80000),
      conic-gradient(from 200deg at 70% 30%, #C41E3A, #6B0F1A, #B80000, #C41E3A),
      radial-gradient(ellipse 120% 80% at 50% 50%, #7A0A1E, #4A0510);
    filter: blur(30px) saturate(1.3);
  }

  .bg-swirl::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 40% 35% at 25% 25%, rgba(196,30,58,0.6) 0%, transparent 70%),
      radial-gradient(ellipse 35% 50% at 75% 75%, rgba(184,0,0,0.5) 0%, transparent 60%),
      radial-gradient(ellipse 60% 30% at 60% 20%, rgba(139,0,0,0.4) 0%, transparent 50%);
    filter: blur(15px);
  }

  /* Noise/texture overlay */
  .texture {
    position: absolute;
    inset: 0;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    mix-blend-mode: overlay;
  }

  /* White center panel */
  .center-panel {
    position: absolute;
    top: 80px;
    left: 120px;
    right: 120px;
    bottom: 80px;
    background: rgba(248, 246, 243, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .logo-container {
    margin-bottom: 20px;
  }

  .logo-container img {
    height: 80px;
    width: auto;
  }

  .tagline-top {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 30px;
  }

  .presents {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 8px;
  }

  .event-title {
    font-family: 'Cormorant', serif;
    font-size: 52px;
    font-weight: 600;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.1;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .edition {
    font-family: 'Cormorant', serif;
    font-size: 28px;
    font-weight: 400;
    font-style: italic;
    color: #C41E3A;
    margin-bottom: 25px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: #C9A962;
    margin-bottom: 25px;
  }

  .subtitle {
    font-family: 'Cormorant', serif;
    font-size: 22px;
    font-weight: 400;
    font-style: italic;
    color: #555;
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.4;
  }

  .event-details {
    text-align: center;
    margin-bottom: 22px;
  }

  .event-details .date {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .event-details .venue {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #777;
  }

  .bottom-tagline {
    font-family: 'Cormorant', serif;
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    color: #888;
    text-align: center;
    margin-bottom: 28px;
  }

  .gold-line {
    width: 40px;
    height: 1px;
    background: #C9A962;
    margin-bottom: 20px;
  }

  .partners {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #aaa;
  }

  .partners span {
    margin: 0 10px;
    color: #ccc;
  }
</style>
</head>
<body>
  <div class="bg-swirl"></div>
  <div class="texture"></div>

  <div class="center-panel">
    <div class="logo-container">
      <img src="../../assets/lume-logo-transparent.png" alt="LUME">
    </div>

    <div class="tagline-top">Beyond Aesthetics. Beyond Impulse.</div>

    <div class="presents">Presents</div>
    <div class="event-title">Chromatic<br>Conversations</div>
    <div class="edition">III</div>

    <div class="divider"></div>

    <div class="subtitle">A curated evening on<br>Art as Investment</div>

    <div class="event-details">
      <div class="date">Saturday, February 28 · 6:30 PM</div>
      <div class="venue">Elements by Nirvania, Hyderabad</div>
    </div>

    <div class="bottom-tagline">For those building value, not just walls.</div>

    <div class="gold-line"></div>

    <div class="partners">
      Hashtag India <span>|</span> We Connect <span>|</span> Elements by Nirvania
    </div>
  </div>
</body>
</html>
