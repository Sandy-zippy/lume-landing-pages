<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME CC3 Carousel — Slide 4: Event Details</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #1a1a1a;
  }

  /* Red swirl background — shifted pattern */
  .bg-swirl {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 80% 20%, #000000 0%, transparent 50%),
      radial-gradient(ellipse 90% 60% at 15% 75%, #111111 0%, transparent 45%),
      radial-gradient(ellipse 40% 50% at 55% 45%, #0a0a0a 0%, transparent 55%),
      radial-gradient(circle at 85% 85%, #000000 0%, transparent 35%),
      radial-gradient(circle at 15% 15%, #9B1B30 0%, transparent 40%),
      conic-gradient(from 135deg at 65% 35%, #111111, #000000, #0a0a0a, #111111, #111111),
      conic-gradient(from 320deg at 35% 65%, #000000, #0a0a0a, #111111, #000000),
      radial-gradient(ellipse 120% 80% at 50% 50%, #0a0a0a, #4A0510);
    filter: blur(35px) saturate(1.2);
  }

  .bg-swirl::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 45% 40% at 70% 30%, rgba(0,0,0,0.5) 0%, transparent 70%),
      radial-gradient(ellipse 40% 45% at 30% 70%, rgba(0,0,0,0.4) 0%, transparent 60%);
    filter: blur(20px);
  }

  .texture {
    position: absolute;
    inset: 0;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    mix-blend-mode: overlay;
  }

  /* White panel — centered */
  .panel {
    position: absolute;
    top: 90px;
    left: 140px;
    right: 140px;
    bottom: 90px;
    background: rgba(248, 246, 243, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 55px 50px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .event-title {
    font-family: 'Cormorant', serif;
    font-size: 34px;
    font-weight: 600;
    color: #1a1a1a;
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .edition-label {
    font-family: 'Cormorant', serif;
    font-size: 22px;
    font-weight: 400;
    font-style: italic;
    color: #000000;
    margin-bottom: 35px;
  }

  .gold-divider {
    width: 50px;
    height: 1px;
    background: #C9A962;
    margin-bottom: 40px;
  }

  /* Details list */
  .details {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 40px;
    width: 100%;
    max-width: 500px;
  }

  .detail-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .detail-icon {
    flex-shrink: 0;
    width: 40px;
    font-size: 22px;
    text-align: center;
    line-height: 1;
  }

  .detail-text {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: #333;
    letter-spacing: 0.5px;
  }

  .detail-text strong {
    font-weight: 500;
    color: #1a1a1a;
  }

  .gold-divider-sm {
    width: 40px;
    height: 1px;
    background: #C9A962;
    margin-bottom: 30px;
  }

  .seats-note {
    font-family: 'Cormorant', serif;
    font-size: 22px;
    font-weight: 400;
    font-style: italic;
    color: #000000;
    text-align: center;
    margin-bottom: 35px;
  }

  .partners {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #aaa;
    text-align: center;
  }

  .partners span {
    margin: 0 8px;
    color: #ccc;
  }

  /* Swipe indicator */
  .swipe {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 10;
  }

  .swipe-arrow {
    width: 28px;
    height: 28px;
    border-right: 2px solid rgba(255,255,255,0.6);
    border-bottom: 2px solid rgba(255,255,255,0.6);
    transform: rotate(-45deg);
  }

  .swipe-text {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    writing-mode: vertical-rl;
    margin-top: 6px;
  }

  .slide-counter {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
  }

  .dot.active {
    background: #C9A962;
    box-shadow: 0 0 6px rgba(201,169,98,0.5);
  }
</style>
</head>
<body>
  <div class="bg-swirl"></div>
  <div class="texture"></div>

  <div class="panel">
    <div class="event-title">Chromatic<br>Conversations</div>
    <div class="edition-label">Edition III</div>

    <div class="gold-divider"></div>

    <div class="details">
      <div class="detail-row">
        <div class="detail-icon">&#x1F4C5;</div>
        <div class="detail-text"><strong>Saturday, February 28</strong></div>
      </div>
      <div class="detail-row">
        <div class="detail-icon">&#x23F0;</div>
        <div class="detail-text"><strong>6:30 PM</strong> onwards</div>
      </div>
      <div class="detail-row">
        <div class="detail-icon">&#x1F4CD;</div>
        <div class="detail-text"><strong>Elements by Nirvania</strong></div>
      </div>
      <div class="detail-row">
        <div class="detail-icon">&#x1F4B0;</div>
        <div class="detail-text"><strong>&#x20B9;4,000</strong> per guest</div>
      </div>
    </div>

    <div class="gold-divider-sm"></div>

    <div class="seats-note">Limited to 40 seats</div>

    <div class="partners">
      Hashtag India <span>|</span> We Connect <span>|</span> Elements by Nirvania
    </div>
  </div>

  <div class="swipe">
    <div class="swipe-arrow"></div>
    <div class="swipe-text">Swipe</div>
  </div>

  <div class="slide-counter">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
