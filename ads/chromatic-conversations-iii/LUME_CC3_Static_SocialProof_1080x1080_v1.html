<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Social Proof Angle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #1a1a1a;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 0% 100%, rgba(0,0,0,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 100% 0%, rgba(0,0,0,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 80% 80% at 50% 50%, #1a1a1a 0%, #111 100%);
  }

  /* Subtle red accent strip at left */
  .left-accent {
    position: absolute;
    top: 0;
    left: 0;
    width: 6px;
    height: 100%;
    background: linear-gradient(to bottom, transparent 10%, #000000 30%, #111111 70%, transparent 90%);
  }

  .texture {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 100px;
  }

  .logo-container {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
  }

  .logo-container img {
    height: 60px;
    width: auto;
  }

  .main-quote {
    font-family: 'Cormorant', serif;
    font-size: 40px;
    font-weight: 400;
    font-style: italic;
    color: rgba(248,246,243,0.85);
    text-align: center;
    line-height: 1.35;
    margin-bottom: 50px;
    max-width: 750px;
  }

  .main-quote strong {
    font-weight: 600;
    font-style: normal;
    color: #f8f6f3;
  }

  .gold-divider {
    width: 60px;
    height: 1px;
    background: #C9A962;
    margin-bottom: 50px;
  }

  /* Stat blocks */
  .stats-row {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 50px;
  }

  .stat-block {
    text-align: center;
    padding: 0 45px;
  }

  .stat-block:not(:last-child) {
    border-right: 1px solid rgba(201,169,98,0.25);
  }

  .stat-number {
    font-family: 'Cormorant', serif;
    font-size: 56px;
    font-weight: 700;
    color: #C9A962;
    line-height: 1;
    margin-bottom: 8px;
  }

  .stat-label {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(248,246,243,0.5);
  }

  .event-subtitle {
    font-family: 'Cormorant', serif;
    font-size: 28px;
    font-weight: 500;
    color: #f8f6f3;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .event-edition {
    font-family: 'Cormorant', serif;
    font-size: 20px;
    font-weight: 400;
    font-style: italic;
    color: #000000;
    margin-bottom: 25px;
  }

  .details-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .details-row .item {
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(248,246,243,0.5);
  }

  .details-row .sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #C9A962;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="left-accent"></div>
  <div class="texture"></div>

  <div class="content">
    <div class="logo-container">
      <img src="../../assets/lume-logo-white.png" alt="LUME">
    </div>

    <div class="main-quote">
      Join <strong>200+ professionals</strong> who trust LUME for curated experiences.
    </div>

    <div class="gold-divider"></div>

    <div class="stats-row">
      <div class="stat-block">
        <div class="stat-number">200+</div>
        <div class="stat-label">Members</div>
      </div>
      <div class="stat-block">
        <div class="stat-number">15+</div>
        <div class="stat-label">Events</div>
      </div>
      <div class="stat-block">
        <div class="stat-number">3</div>
        <div class="stat-label">Editions</div>
      </div>
    </div>

    <div class="event-subtitle">Chromatic Conversations</div>
    <div class="event-edition">III</div>

    <div class="details-row">
      <div class="item">Feb 28</div>
      <div class="sep"></div>
      <div class="item">6:30 PM</div>
      <div class="sep"></div>
      <div class="item">Elements by Nirvania</div>
      <div class="sep"></div>
      <div class="item">₹4,000</div>
    </div>
  </div>
</body>
</html>
