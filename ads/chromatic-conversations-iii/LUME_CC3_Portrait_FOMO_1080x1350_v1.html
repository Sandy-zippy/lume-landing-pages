<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>LUME — Chromatic Conversations III — FOMO</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    position: relative;
    background: #FAF9F7;
  }

  /* Dark background with red glow */
  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 45%, rgba(0,0,0,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 30% 60%, rgba(0,0,0,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 70% 30%, rgba(0,0,0,0.12) 0%, transparent 55%);
  }
  .bg-grain {
    position: absolute;
    inset: 0;
    background:
      repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(255,255,255,0.008) 1deg, transparent 2deg) 0 0 / 200px 200px;
    mix-blend-mode: overlay;
  }

  /* Red edge glow */
  .edge-glow-top {
    position: absolute;
    top: -2px; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent 10%, #FF5149 30%, #C41E3A 50%, #FF5149 70%, transparent 90%);
    box-shadow: 0 0 40px 10px rgba(255,81,73,0.12);
  }
  .edge-glow-bottom {
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent 10%, #FF5149 30%, #C41E3A 50%, #FF5149 70%, transparent 90%);
    box-shadow: 0 0 40px 10px rgba(255,81,73,0.12);
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 60px;
    z-index: 10;
    text-align: center;
  }

  .countdown-block {
    margin-bottom: 50px;
  }
  .countdown-line {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 8px;
    color: #1A1A1A;
    line-height: 1.15;
  }
  .countdown-line.day {
    font-size: 88px;
    text-shadow: 0 0 60px rgba(255,81,73,0.5);
  }
  .countdown-line.time {
    font-size: 110px;
    color: #C41E3A;
    text-shadow: 0 0 80px rgba(255,81,73,0.6), 0 0 30px rgba(0,0,0,0.3);
    letter-spacing: 12px;
  }
  .countdown-line.seats {
    font-size: 72px;
    color: #C9A962;
    text-shadow: none;
    margin-top: 5px;
  }

  .gold-rule {
    width: 120px; height: 2px;
    background: linear-gradient(90deg, transparent, #C9A962, transparent);
    margin: 0 auto 40px;
  }

  .event-title {
    font-family: 'Cormorant', serif;
    font-weight: 500;
    font-size: 52px;
    color: rgba(26,26,26,0.95);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .event-venue {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 28px;
    color: rgba(26,26,26,0.6);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 45px;
  }

  .cta-line {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 30px;
    color: #1A1A1A;
    padding: 20px 50px;
    border: 2px solid rgba(255,81,73,0.6);
    background: rgba(255,81,73,0.06);
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .cta-line .price {
    color: #C9A962;
    font-weight: 700;
  }

  .logo-bottom {
    position: absolute;
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    width: 140px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grain"></div>
  <div class="edge-glow-top"></div>
  <div class="edge-glow-bottom"></div>

  <div class="content">
    <div class="countdown-block">
      <div class="countdown-line day">THIS SATURDAY</div>
      <div class="countdown-line time">6:30 PM</div>
      <div class="countdown-line seats">40 SEATS</div>
    </div>

    <div class="gold-rule"></div>

    <div class="event-title">Chromatic Conversations III</div>
    <div class="event-venue">Elements by Nirvania</div>

    <div class="cta-line"><span class="price">&#8377;4,000</span> &mdash; Reserve now before it&rsquo;s gone.</div>
  </div>

  <img src="../../assets/lume-logo-transparent.png" alt="LUME" class="logo-bottom">
</body>
</html>
